<script id="ng-state" type="application/json">{"3956564209":{"b":{"__header":"header","home":"الصفحة الرئيسية","about":"من نحن","services":"خدماتنا","projects":"مشاريعنا","contact":"تواصل معنا","landing":{"eyebrow":"التطوير العقاري · رؤية ٢٠٣٠","name":"شركة مدائن العقارية","s1":"نبني قيمة حقيقية","s2":"ونُطوّر أسلوب حياة ","subtitle":"نطوّر مجتمعات سكنية متكاملة في قلب المملكة العربية السعودية، بمعايير جودة ترتقي بمستوى الطموحات الوطنية.","btn1":"خريطة المشاريع","btn2":"تواصل معنا","stat1_num":"+٢٠","stat1_lbl":"سنة خبرة","stat2_num":"+٧٠٠","stat2_lbl":"وحدة سكنية","stat3_num":"٣","stat3_lbl":"مدن سعودية"},"overview":{"text":"منذ تأسيس مدائن العقارية حملنا على عاتقنا رسالة تقديم خدمات عقارية متكاملة، تتسم بالشفافية والمصداقية وتلبي احتياجات عملائنا بأعلى درجات الجودة. رؤيتنا تتجاوز فكرة تطوير المشاريع إلى خلق بيئات سكنية متكاملة، حيث نطمح أن تكون مدائن العقارية علامة فارقة في بناء مجتمعات عصرية مستدامة، ومصدر ثقة لكل من يبحث عن الاستثمار الآمن والراحة المستمرة. نحن لا نبيع عقارًا فحسب، بل نقدّم تجربة حياة متكاملة تُصاغ بعناية لتكون امتدادًا لطموحات عملائنا وتطلعاتهم.","btn":"اعرف المزيد"},"vesion":{"title":"مواقع مميزة و ضمانات ممتدة","des":"مدائن العقارية شركة سعودية راسخة تمتلك أسساً قوية وخبرات واسعة في مجال التطوير والتسويق والاستثمار العقاري تهدف لتحقيق المزيد من التوسع والانتشار وتطوير المشاريع العقارية المختلفة والمتنوعة على نطاق واسع وتحرص على تقديم أفضل الخدمات في مجال التمليك والتطوير العقاري بمدينة جدة وتسهيل عملية اتخاذ عملائنا لقرارات صحيحة","ves":"رؤيتنا","ves_des":"أن نكون من الشركات الرائدة في تطوير المشاريع العقارية المستدامة والذكية في المملكة العربية السعودية، وأن تساهم في إعادة تعريف جودة السكن والتجربة العمرانية المتكاملة.","message":"رسالتنا","message_des":"تطوير مشاريع عمرانية متكاملة تلبي احتياجات المجتمع وتحقق تطلعات العملاء والمستثمرين. من خلال الابتكار في التصميم الالتزام بالجودة، والامتثال الكامل للأنظمة، والمعايير الوطنية."},"proj":{"makkah":"مشاريع مكة","makkah-des":"اكتشف أحدث مشاريعنا في مكة المكرمة","jeddah":"مشاريع جدة","jeddah-des"  نحو مراحل جديدة من النجاح والاستدامة."}},"footer":{"madain":"مدائن , حلمك بالسكن الراقي يبدأ معنا","contact":"التواصل","pages":"الصفحات","address1":"جدة - حي السلامة - شارع اليمامة - مركز اليمامة للاعمال - مكتب  201","address2":"مكة المكرمة - بطحاء قريش - شارع ثوبان النبوي - مكتب ٤٠٨ ","location":"مواقع الشركة"},"about_sec":{"title":"من نحن","title2":"قيمنا","name":"أ/ طاهر آل مصلح ","jop":"رئيس مجلس الإدارة","speech":"كلمة رئيس مجلس الإدارة","des":"شركة مدائن للتطوير العقاري هي شركة تطوير عقاري مرخصة في المملكة العربية السعودية وتهدف إلى تطوير مشاريع سكنية وتجارية عالية الجودة تتماشى مع مستهدفات رؤية المملكة 2030، وتُسهم في رفع نسبة تملك المواطنين وتحقيق التنمية العمرانية المستدامة. تعتمد الشركة على منهجية تطوير متكاملة تبدأ من دراسة الجدوى وتحديد المواقع الاستراتيجية، مروراً بالتصميم والترخيص و وصولاً إلى التنفيذ والتسويق والتسليم مع الالتزام التام بالامتثال التنظيمي، وجودة البناء، وخدمة ما بعد البيع.","word1":"بسم الله الرحمن الرحيم والصلاة والسلام على أشرف المرسلين سيدنا محمد وعلى آله وصحبه أجمعين مشوار الألف ميل يبدأ بخطوة، ونحن منذ بداية عملنا وعلى خطى 20 عامًا من الخبرة نمضي للأمام لبناء المستقبل بخطوات من الأمل والعزيمة والإصرار على تحقيق النجاح والإنجازات الملموسة. نفخر بتقديم حلولنا العقارية التي تلبي احتياجات إخواننا وأخواتنا وتدعم رؤية الوطن الغالي رؤية المملكة العربية السعودية 2030 فطموحنا أن تكون شركة مدائن للتطوير العقاري ركيزة أساسية في خطة الازدهار والتقدم التي تشهدها المملكة.","word2":"نؤمن بأن العقار هو أكثر من مجرد مبنى، إنه استثمار في المستقبل منذ تأسيسنا ونحن نضع نصب أعيننا تقديم مشاريع تلبي تطلعات عملائنا وتساهم في تعزيز الاقتصاد الوطني. ى جاهدين بفضل الله عز وجل على تقديم أرقى الخدمات على مستوى عالي من الجودة والكفاءة والأمانة أشكر الله عز وجل أن حبانا في المملكة العربية السعودية ولاة أمرنا يسعون دائمًا في تحقيق جودة الحياة للمواطنين والمقيمين المتضمنة في رؤية 2030، والشكر موصول لكل من وقف معي وساندني في تأسيس الشركة من المطورين العقاريين في مدينة جدة التي تمتد خبراتهم لأكثر من 20 عاما. والله ولي التوفيق ...","team":{"head1":"فريق عملنا ","h
