<div class="partners-section">
  <div class="section-title">
    <h2>{{ lang === 'ar' ? 'شركاء النجاح' : 'Partners' }}</h2>
  </div>

  <!-- شريط واحد بعرض محدود + أسهم على الجنبين -->
  <div class="partners-slider">
    <button type="button" class="partners-nav partners-nav--prev" #prevBtn
      [attr.aria-label]="lang === 'ar' ? 'السابق' : 'Previous'">
      <i class="fas" [class.fa-chevron-right]="lang === 'ar'" [class.fa-chevron-left]="lang !== 'ar'"></i>
    </button>

    <div class="swiper" #swiperRef>
      <div class="swiper-wrapper">
        @for (part of partners; track $index) {
          <div class="swiper-slide">
            <div class="partner-card">
              <img [src]="url + part.imagePath" [alt]="(lang === 'ar' ? 'شعار شريك مدائن العقارية' : 'Madain Real Estate partner logo') + ' ' + ($index + 1)" loading="lazy" />
            </div>
          </div>
        }
      </div>
    </div>

    <button type="button" class="partners-nav partners-nav--next" #nextBtn
      [attr.aria-label]="lang === 'ar' ? 'التالي' : 'Next'">
      <i class="fas" [class.fa-chevron-left]="lang === 'ar'" [class.fa-chevron-right]="lang !== 'ar'"></i>
    </button>
  </div>
</div>
