<section class="news">
    <header class="section-title container">
        <h2 class="">{{'news.title' | translate}}</h2>
    </header>
    <div class="container-fluid">
        <div class="swiper mySwiper2 mt-5">
            <div class="swiper-wrapper">
                @for(n of news; track $index) {
                <div class="swiper-slide news-card">
                    <div class="news-card__image">
                        @if(n.imagePaths.length > 0) {
                            <img [src]="url + n.imagePaths[0]" alt="Project Delivery" loading="lazy">
                        } @else {
                            <div class="video-player" #videoWrapper>
                                <video
                                    #videoEl
                                    [src]="url + n.videoPath"
                                    (timeupdate)="onTimeUpdate(videoEl, $index)"
                                    (loadedmetadata)="onMetadata(videoEl, $index)"
                                    (ended)="onEnded($index)"
                                    preload="metadata"
                                ></video>

                                <!-- Overlay play button -->
                                <div class="video-overlay"
                                     [class.is-playing]="videoStates[$index]?.playing"
                                     (click)="togglePlay(videoEl, $index)">
                                    <div class="play-icon-big">
                                        <svg viewBox="0 0 24 24" fill="white">
                                            <path d="M8 5v14l11-7z"/>
                                        </svg>
                                    </div>
                                </div>

                                <!-- Controls bar -->
                                <div class="video-controls">
                                    <!-- Play / Pause -->
                                    <button class="vc-btn" (click)="togglePlay(videoEl, $index)">
                                        @if(videoStates[$index]?.playing) {
                                            <svg viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M6 19h4V5H6zm8-14v14h4V5z"/>
                                            </svg>
                                        } @else {
                                            <svg viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M8 5v14l11-7z"/>
                                            </svg>
                                        }
                                    </button>

                                    <!-- Current time -->
                                    <span class="vc-time">{{ videoStates[$index]?.currentTime || '0:00' }}</span>

                                    <!-- Progress bar -->
                                    <input
                                        type="range" min="0" max="100"
                                        [value]="videoStates[$index]?.progress || 0"
                                        (input)="seek(videoEl, $event, $index)"
                                        class="vc-progress"
                                    />

                                    <!-- Duration -->
                                    <span class="vc-time">{{ videoStates[$index]?.duration || '0:00' }}</span>

                                    <!-- Mute -->
                                    <button class="vc-btn" (click)="toggleMute(videoEl, $index)">
                                        @if(videoStates[$index]?.muted) {
                                            <svg viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 18L19 19.27 20.27 18 5.27 3 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                                            </svg>
                                        } @else {
                                            <svg viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                            </svg>
                                        }
                                    </button>

                                    <!-- Fullscreen -->
                                    <button class="vc-btn" (click)="toggleFullscreen(videoWrapper)">
                                        <svg viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        }
                    </div>
                    <div class="news-card__content">
                        <h3 class="news-card__title">
                            {{lang == "ar" ? n.arTitle : n.enTitle}}
                        </h3>
                        <p class="news-card__desc">
                            {{lang == "ar" ? n.arDescription : n.enDescription}}
                        </p>
                    </div>
                </div>
                }
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>
</section>
